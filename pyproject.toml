[project]
name = "handheld-super-resolution"
version = "0.1.0"
description = "Handheld multi-frame super-resolution (Wronski et al.)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy<2.5",
    "torch",
    "rawpy",
    "exifread",
    "scipy",
    "scikit-image",
    "opencv-python-headless",
    "colour-demosaicing",
    "matplotlib",
    "tyro",
    "imageio",
    "slangpy>=0.43.1",
]

[project.scripts]
handheld = "handheld_super_resolution.cli:main"

[build-system]
requires = ["scikit-build-core>=0.10", "halide>=21.0.0", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "alignment"
wheel.packages = ["handheld_super_resolution"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
